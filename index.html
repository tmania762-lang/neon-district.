<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050509;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
}

.topbar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 18px;

    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.75),
        rgba(0,0,0,0)
    );
}

.logo {
    font-weight: 900;
    font-style: italic;
    letter-spacing: 3px;
    font-size: 22px;
    text-shadow:
        0 0 8px #00d9ff,
        0 0 18px #ff00cc;
}

.money {
    color: #6cff9a;
    font-size: 18px;
    font-weight: bold;
}

/* =========================
   MENU
========================= */

#garageMenu {
    position: absolute;

    left: 18px;
    top: 90px;

    width: 250px;

    padding: 15px;

    background: rgba(5,5,12,.84);

    border: 1px solid rgba(0,220,255,.4);

    box-shadow:
        0 0 20px rgba(0,220,255,.15),
        inset 0 0 20px rgba(255,0,180,.04);

    backdrop-filter: blur(8px);

    pointer-events: auto;
}

.menuTitle {
    font-size: 13px;
    color: #00dcff;
    letter-spacing: 3px;
    margin-bottom: 12px;
}

.menuButton {
    width: 100%;
    margin-bottom: 8px;

    padding: 12px;

    border: 1px solid rgba(255,255,255,.15);

    background: rgba(255,255,255,.06);

    color: white;

    text-align: left;

    font-weight: bold;

    cursor: pointer;

    transition: .15s;
}

.menuButton:hover,
.menuButton.active {
    background: linear-gradient(
        90deg,
        rgba(0,220,255,.22),
        rgba(255,0,180,.18)
    );

    border-color: #00dcff;

    box-shadow: 0 0 12px rgba(0,220,255,.25);
}

/* =========================
   CUSTOMIZATION
========================= */

#customPanel {
    position: absolute;

    right: 18px;
    top: 90px;

    width: 280px;

    padding: 16px;

    background: rgba(5,5,12,.88);

    border: 1px solid rgba(255,0,200,.4);

    backdrop-filter: blur(10px);

    pointer-events: auto;

    display: none;
}

.panelTitle {
    font-size: 13px;
    color: #ff42d0;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.section {
    margin-bottom: 18px;
}

.section label {
    display: block;

    font-size: 11px;

    color: #aaa;

    margin-bottom: 8px;

    letter-spacing: 1px;
}

.colorGrid {
    display: grid;

    grid-template-columns: repeat(5, 1fr);

    gap: 7px;
}

.colorButton {
    height: 32px;

    border: 2px solid rgba(255,255,255,.2);

    cursor: pointer;

    transition: .15s;
}

.colorButton:hover {
    transform: scale(1.08);
}

.colorButton.selected {
    border-color: white;

    box-shadow:
        0 0 8px white;
}

/* =========================
   STATS
========================= */

#stats {
    position: absolute;

    left: 18px;
    bottom: 18px;

    width: 250px;

    padding: 15px;

    background: rgba(0,0,0,.72);

    border-left: 3px solid #00dcff;

    pointer-events: none;
}

.carName {
    font-size: 19px;

    font-weight: 900;

    font-style: italic;

    letter-spacing: 2px;

    margin-bottom: 12px;
}

.stat {
    margin-bottom: 9px;
}

.statHeader {
    display: flex;

    justify-content: space-between;

    font-size: 11px;

    color: #bbb;

    margin-bottom: 4px;
}

.bar {
    height: 5px;

    background: rgba(255,255,255,.12);
}

.barFill {
    height: 100%;

    background: linear-gradient(
        90deg,
        #00dcff,
        #ff00d4
    );

    box-shadow:
        0 0 8px rgba(0,220,255,.5);
}

/* =========================
   HELP
========================= */

#help {
    position: absolute;

    right: 18px;
    bottom: 18px;

    font-size: 11px;

    color: #999;

    text-align: right;
}

/* =========================
   TOUCH CONTROLS
========================= */

#touchControls {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    display: none;

    justify-content: space-between;

    padding: 15px;

    pointer-events: none;
}

.touchGroup {
    display: flex;
    gap: 10px;

    pointer-events: auto;
}

.touchButton {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    border: 1px solid rgba(255,255,255,.3);

    background: rgba(0,0,0,.6);

    color: white;

    font-size: 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    touch-action: none;
}

.touchButton:active {
    background: rgba(0,220,255,.3);
}

@media(max-width: 800px) {

    #garageMenu {
        left: 10px;
        top: 75px;
        width: 175px;
    }

    #customPanel {
        right: 10px;
        top: 75px;
        width: 210px;
        max-height: 55vh;
        overflow-y: auto;
    }

    #stats {
        left: 10px;
        bottom: 90px;
        width: 190px;
    }

    #help {
        display: none;
    }

    #touchControls {
        display: flex;
    }

    .logo {
        font-size: 16px;
    }
}
</style>

<script type="module">

import * as THREE
from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   VARIABLES
===================================================== */

let scene;
let camera;
let renderer;

let car;

let bodyMeshes = [];
let wheelMeshes = [];
let neonLights = [];

let cameraAngle = 0;
let cameraDistance = 8;

let autoRotate = true;

let targetAngle = 0;

let bodyColor = "#111111";
let wheelColor = "#111111";
let neonColor = "#00dcff";

let money = 25000;


/* =====================================================
   INIT
===================================================== */

init();

function init() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color("#050509");

    scene.fog =
        new THREE.FogExp2("#050509", 0.035);


    /* CAMERA */

    camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );


    /* RENDERER */

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 2)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    /* LIGHTING */

    createLighting();


    /* GARAGE */

    createGarage();


    /* CAR */

    car = createCar();

    scene.add(car);


    /* CAMERA */

    updateCamera();


    /* EVENTS */

    window.addEventListener(
        "resize",
        onResize
    );

    setupMouse();

    setupTouch();

    setupMenu();

    setupColors();


    /* LOOP */

    animate();
}


/* =====================================================
   LIGHTING
===================================================== */

function createLighting() {

    const ambient =
        new THREE.AmbientLight(
            0x666677,
            1.5
        );

    scene.add(ambient);


    const mainLight =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    mainLight.position.set(
        4,
        8,
        5
    );

    mainLight.castShadow = true;

    scene.add(mainLight);


    const cyan =
        new THREE.PointLight(
            0x00dcff,
            25,
            20
        );

    cyan.position.set(
        -5,
        3,
        3
    );

    scene.add(cyan);


    const pink =
        new THREE.PointLight(
            0xff00cc,
            25,
            20
        );

    pink.position.set(
        5,
        3,
        -3
    );

    scene.add(pink);

}


/* =====================================================
   GARAGE
===================================================== */

function createGarage() {

    /* FLOOR */

    const floorGeometry =
        new THREE.PlaneGeometry(
            40,
            40
        );

    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x101015,
            roughness: 0.35,
            metalness: 0.75
        });

    const floor =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);


    /* PLATFORM */

    const platformGeometry =
        new THREE.CylinderGeometry(
            3.5,
            3.5,
            .25,
            64
        );

    const platformMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x171720,
            metalness: 0.8,
            roughness: 0.25
        });

    const platform =
        new THREE.Mesh(
            platformGeometry,
            platformMaterial
        );

    platform.position.y =
        .12;

    platform.receiveShadow = true;

    scene.add(platform);


    /* PLATFORM RING */

    const ringGeometry =
        new THREE.TorusGeometry(
            3.5,
            .035,
            12,
            64
        );

    const ringMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x00dcff
        });

    const ring =
        new THREE.Mesh(
            ringGeometry,
            ringMaterial
        );

    ring.rotation.x =
        Math.PI / 2;

    ring.position.y =
        .27;

    scene.add(ring);


    /* BACK WALL */

    const wallGeometry =
        new THREE.BoxGeometry(
            40,
            10,
            .5
        );

    const wallMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x08080d,
            roughness: .8
        });

    const wall =
        new THREE.Mesh(
            wallGeometry,
            wallMaterial
        );

    wall.position.set(
        0,
        5,
        -7
    );

    wall.receiveShadow = true;

    scene.add(wall);


    /* NEON WALL STRIPS */

    createNeonStrip(
        -7,
        4.5,
        -6.7,
        0x00dcff
    );

    createNeonStrip(
        7,
        4.5,
        -6.7,
        0xff00cc
    );


    /* FLOOR LINES */

    for(let i = -12; i <= 12; i += 3) {

        const geometry =
            new THREE.BoxGeometry(
                .04,
                .01,
                40
            );

        const material =
            new THREE.MeshBasicMaterial({
                color: 0x15151c
            });

        const line =
            new THREE.Mesh(
                geometry,
                material
            );

        line.position.x = i;

        line.position.y =
            .015;

        scene.add(line);

    }

}


/* =====================================================
   NEON STRIP
===================================================== */

function createNeonStrip(
    x,
    y,
    z,
    color
) {

    const geometry =
        new THREE.BoxGeometry(
            .08,
            5,
            .08
        );

    const material =
        new THREE.MeshBasicMaterial({
            color: color
        });

    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.position.set(
        x,
        y,
        z
    );

    scene.add(mesh);


    const light =
        new THREE.PointLight(
            color,
            18,
            12
        );

    light.position.set(
        x,
        y,
        z
    );

    scene.add(light);

}
