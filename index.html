<!DOCTYPE html>
<html lang="es">
<head>

<title>NEON DISTRICT — V0.3 VISUAL TUNING</title>

<style>
*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 user-select:none;
 -webkit-user-select:none;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;

 color:white;

}

#game{

}

canvas{

}

#hud{

 pointer-events:none;
}

.topbar{

.logo{

.money{

}

#menu{

 backdrop-filter:blur(10px);

}

.title{
 color:#00dcff;
 font-size:12px;
 letter-spacing:3px;
 margin-bottom:12px;
}

button{
 font-family:inherit;
}

.menuBtn{

 margin-bottom:7px;

 text-align:left;
 cursor:pointer;
}

.menuBtn:hover,
.menuBtn.active{

}

#tuning{

 top:85px;
 right:15px;

 max-height:calc(100vh - 105px);
 overflow-y:auto;
 padding:15px;
 background:rgba(5,5,12,.92);
 border:1px solid rgba(255,0,200,.4);
 backdrop-filter:blur(10px);
 pointer-events:auto;
 display:none;
}

#tuning::-webkit-scrollbar{

}

#tuning::-webkit-scrollbar-thumb{

}

.tuningTitle{

 font-size:13px;

 margin-bottom:15px;
}

.category{
 margin-bottom:18px;
}

.categoryTitle{

 font-size:10px;

 margin-bottom:8px;
}

.optionGrid{

 grid-template-columns:repeat(2,1fr);
 gap:6px;
}

.option{

 padding:7px;

 background:rgba(255,255,255,.05);
 border:1px solid rgba(255,255,255,.13);

 text-align:left;
}

.option small{
 display:block;
 color:#777;
 font-size:9px;
 margin-top:3px;
}

.option:hover{
 border-color:#00dcff;
}

.option.selected{
 border-color:#ff00cc;
 background:rgba(255,0,200,.13);
 box-shadow:0 0 8px rgba(255,0,200,.2);
}

.colorGrid{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:6px;
}

.color{
 height:30px;
 border:2px solid rgba(255,255,255,.2);
 cursor:pointer;
}

.color.selected{
 border-color:white;
 box-shadow:0 0 10px white;
}

#stats{
 position:absolute;
 bottom:18px;
 left:15px;
 width:245px;
 padding:14px;
 background:rgba(0,0,0,.78);
 border-left:3px solid #00dcff;
}

.carName{
 font-size:18px;
 font-weight:900;
 font-style:italic;
 letter-spacing:2px;
 margin-bottom:12px;
}

.stat{
 margin-bottom:8px;
}

.statHead{
 display:flex;
 justify-content:space-between;
 font-size:10px;
 color:#aaa;
 margin-bottom:4px;
}

.statBar{
 height:5px;

}

.statFill{
 height:100%;
 background:linear-gradient(90deg,#00dcff,#ff00cc);
}

#controls{
 position:absolute;
 bottom:18px;
 right:15px;
 display:flex;
 gap:7px;
 pointer-events:auto;
}

.controlBtn{
 padding:10px 12px;
 color:white;
 background:rgba(0,0,0,.7);
 border:1px solid rgba(255,255,255,.2);
 cursor:pointer;
}

#touch{
 position:fixed;
 bottom:15px;
 left:0;
 right:0;
 display:none;
 justify-content:space-between;
 padding:0 15px;
 pointer-events:none;
}

.touchGroup{
 display:flex;
 gap:8px;
 pointer-events:auto;
}

.touchBtn{
 width:58px;
 height:58px;
 border-radius:50%;
 background:rgba(0,0,0,.65);
 border:1px solid rgba(255,255,255,.3);
 color:white;
 font-size:20px;
 touch-action:none;
}

@media(max-width:800px){

 #menu{
  left:8px;
  top:72px;
  width:165px;

  right:8px;
  top:72px;
  width:205px;
  max-height:55vh;

 #stats{
  left:8px;
  bottom:85px;
  width:190px;
 }

 #controls{
  display:none;
 }

 #touch{
  display:flex;
 }

 .logo{
  font-size:15px;
 }
}
</style>
</head>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   GAME STATE
===================================================== */

const state = {

 money:25000,

 paint:"#111111",
 neon:"#00dcff",

 wheels:0,
 spoiler:0,
 bumper:0,
 exhaust:0,
 suspension:0,

 power:68,
 speed:72,
 acceleration:75,
 handling:61,
 style:20

};


/* =====================================================
   THREE
===================================================== */

let scene;
let camera;
let renderer;

let car;

let bodyParts=[];
let wheels=[];
let spoilerParts=[];
let bumperParts=[];
let exhaustParts=[];
let neonObjects=[];

let cameraAngle=0;
let cameraDistance=8;
let autoRotate=true;

let mouseDown=false;
let lastX=0;


/* =====================================================
   INIT
===================================================== */

init();

function init(){

 scene=new THREE.Scene();

 scene.background=
 new THREE.Color(0x050509);

 scene.fog=
 new THREE.FogExp2(
  0x050509,
  .035
 );

 camera=
 new THREE.PerspectiveCamera(
  45,
  innerWidth/innerHeight,
  .1,
  1000
 );

 renderer=
 new THREE.WebGLRenderer({
  antialias:true
 });

 renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
 );

 renderer.setSize(
  innerWidth,
  innerHeight
 );

 renderer.shadowMap.enabled=true;

 document
 .getElementById("game")
 .appendChild(renderer.domElement);

 createLights();
 createGarage();

 car=createCar();

 scene.add(car);

 loadSave();
 setupUI();
 setupMouse();
 setupTouch();

 updateCamera();

 addEventListener(
  "resize",
  resize
 );

 animate();
}


/* =====================================================
   LIGHTS
===================================================== */

function createLights(){

 const ambient=
 new THREE.AmbientLight(
  0x777788,
  1.6
 );

 scene.add(ambient);

 const main=
 new THREE.DirectionalLight(
  0xffffff,
  2.2
 );

 main.position.set(
  5,9,5
 );

 main.castShadow=true;

 scene.add(main);

 const cyan=
 new THREE.PointLight(
  0x00dcff,
  30,
  20
 );

 cyan.position.set(
  -6,4,3
 );

 scene.add(cyan);

 const pink=
 new THREE.PointLight(
  0xff00cc,
  30,
  20
 );

 pink.position.set(
  6,4,-3
 );

 scene.add(pink);
}


/* =====================================================
   GARAGE
===================================================== */

function createGarage(){

 const floor=
 new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({
   color:0x111116,
   roughness:.3,
   metalness:.8
  })
 );

 floor.rotation.x=-Math.PI/2;
 floor.receiveShadow=true;

 scene.add(floor);


 const platform=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   3.7,3.7,.25,64
  ),
  new THREE.MeshStandardMaterial({
   color:0x181820,
   metalness:.8,
   roughness:.25
  })
 );

 platform.position.y=.12;

 scene.add(platform);


 const ring=
 new THREE.Mesh(
  new THREE.TorusGeometry(
   3.7,.045,12,64
  ),
  new THREE.MeshBasicMaterial({
   color:0x00dcff
  })
 );

 ring.rotation.x=Math.PI/2;
 ring.position.y=.27;

 scene.add(ring);


 const wall=
 new THREE.Mesh(
  new THREE.BoxGeometry(40,10,.5),
  new THREE.MeshStandardMaterial({
   color:0x08080d
  })
 );

 wall.position.set(0,5,-7);

 scene.add(wall);


 createNeonWall(-7,4.5,-6.7,0x00dcff);
 createNeonWall(7,4.5,-6.7,0xff00cc);
}


function createNeonWall(x,y,z,color){

 const mesh=
 new THREE.Mesh(
  new THREE.BoxGeometry(.08,5,.08),
  new THREE.MeshBasicMaterial({
   color
  })
 );

 mesh.position.set(x,y,z);

 scene.add(mesh);

 const light=
 new THREE.PointLight(
  color,
  18,
  12
 );

 light.position.set(x,y,z);

 scene.add(light);
}


/* =====================================================
   CAR
===================================================== */

function createCar(){

 const group=
 new THREE.Group();


 const bodyMat=
 new THREE.MeshStandardMaterial({
  color:state.paint,
  metalness:.88,
  roughness:.2
 });


 /* BODY */

 const body=
 new THREE.Mesh(
  new THREE.BoxGeometry(3.3,.68,1.5),
  bodyMat
 );

 body.position.y=1.05;
 body.castShadow=true;

 group.add(body);

 bodyParts.push(body);


 /* HOOD */

 const hood=
 new THREE.Mesh(
  new THREE.BoxGeometry(1.35,.25,1.42),
  bodyMat
 );

 hood.position.set(
  1.15,1.38,0
 );

 group.add(hood);
 bodyParts.push(hood);


 /* CABIN */

 const cabin=
 new THREE.Mesh(
  new THREE.BoxGeometry(1.5,.65,1.3),
  new THREE.MeshStandardMaterial({
   color:0x101820,
   metalness:.6,
   roughness:.1
  })
 );

 cabin.position.set(
  -.35,1.58,0
 );

 group.add(cabin);


 /* ROOF */

 const roof=
 new THREE.Mesh(
  new THREE.BoxGeometry(1.35,.12,1.32),
  bodyMat
 );

 roof.position.set(
  -.35,1.92,0
 );

 group.add(roof);
 bodyParts.push(roof);


 /* BUMPERS */

 createBumper(group);


 /* SPOILER */

 createSpoiler(group);


 /* EXHAUST */

 createExhaust(group);


 /* WHEELS */

 const positions=[
  [1.05,.65,.86],
  [1.05,.65,-.86],
  [-1.15,.65,.86],
  [-1.15,.65,-.86]
 ];

 positions.forEach(
  p=>{

   const wheel=
   createWheel();

   wheel.position.set(
    p[0],p[1],p[2]
   );

   group.add(wheel);
   wheels.push(wheel);

  }
 );


 /* HEADLIGHTS */

 createLight(group,1.88,1.2,.55,0xeaffff);
 createLight(group,1.88,1.2,-.55,0xeaffff);

 createLight(group,-1.68,1.2,.55,0xff0033);
 createLight(group,-1.68,1.2,-.55,0xff0033);


 /* NEON */

 const neon=
 new THREE.PointLight(
  state.neon,
  12,
  8
 );

 neon.position.y=.5;

 group.add(neon);

 neonObjects.push(neon);


 const glow=
 new THREE.Mesh(
  new THREE.PlaneGeometry(2.9,1.4),
  new THREE.MeshBasicMaterial({
   color:state.neon,
   transparent:true,
   opacity:.2,
   side:THREE.DoubleSide
  })
 );

 glow.rotation.x=-Math.PI/2;
 glow.position.y=.35;

 group.add(glow);

 neonObjects.push(glow);


 return group;
}


/* =====================================================
   WHEEL
===================================================== */

function createWheel(){

 const group=
 new THREE.Group();

 const tire=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .43,.43,.26,32
  ),
  new THREE.MeshStandardMaterial({
   color:0x111111,
   roughness:.38,
   metalness:.45
  })
 );

 tire.rotation.z=Math.PI/2;

 group.add(tire);


 const rim=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   .24,.24,.28,16
  ),
  new THREE.MeshStandardMaterial({
   color:0xaaaaaa,
   metalness:1,
   roughness:.15
  })
 );

 rim.rotation.z=Math.PI/2;

 group.add(rim);


 return group;
}


/* =====================================================
   BUMPER
===================================================== */

function createBumper(group){

 const bumper=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .3,.25,1.55
  ),
  new THREE.MeshStandardMaterial({
   color:state.paint,
   metalness:.88,
   roughness:.2
  })
 );

 bumper.position.set(
  1.7,.92,0
 );

 group.add(bumper);
 bumperParts.push(bumper);

}


/* =====================================================
   SPOILER
===================================================== */

function createSpoiler(group){

 const holder1=
 new THREE.Mesh(
  new THREE.BoxGeometry(.08,.4,.08),
  new THREE.MeshStandardMaterial({
   color:0x111111
  })
 );

 const holder2=
 holder1.clone();

 holder1.position.set(
  -1.35,1.48,.45
 );

 holder2.position.set(
  -1.35,1.48,-.45
 );

 group.add(holder1);
 group.add(holder2);

 const wing=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .7,.08,1.45
  ),
  new THREE.MeshStandardMaterial({
   color:state.paint,
   metalness:.8
  })
 );

 wing.position.set(
  -1.45,1.72,0
 );

 group.add(wing);

 spoilerParts.push(
  holder1,
  holder2,
  wing
 );

}


/* =====================================================
   EXHAUST
===================================================== */

function createExhaust(group){

 const createPipe=z=>{

  const pipe=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .09,.09,.35,16
   ),
   new THREE.MeshStandardMaterial({
    color:0x777777,
    metalness:1,
    roughness:.15
   })
  );

  pipe.rotation.z=Math.PI/2;

  pipe.position.set(
   -1.78,.78,z
  );

  group.add(pipe);

  exhaustParts.push(pipe);
 };

 createPipe(.45);
 createPipe(-.45);
}


/* =====================================================
   LIGHT
===================================================== */

function createLight(
 group,x,y,z,color
){

 const mesh=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   .12,.16,.35
  ),
  new THREE.MeshBasicMaterial({
   color
  })
 );

 mesh.position.set(
  x,y,z
 );

 group.add(mesh);
}


/* =====================================================
   APPLY TUNING
===================================================== */

function applyTuning(){

 /* WHEELS */

 wheels.forEach(
  wheel=>{

   wheel.scale.set(
    1,1,1
   );

  }
 );


 if(state.wheels===1){

  wheels.forEach(
   w=>w.scale.set(
    1.08,1.08,1.08
   )
  );
