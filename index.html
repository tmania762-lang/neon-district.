<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEON DISTRICT — V0.1</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050509;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      touch-action: none;
    }

    #game {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* HUD */

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #logo {
      position: absolute;
      top: 18px;
      left: 20px;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 4px;
      text-shadow:
        0 0 8px #00eaff,
        0 0 20px #00eaff;
    }

    #version {
      font-size: 10px;
      letter-spacing: 2px;
      opacity: 0.7;
      margin-top: 3px;
    }

    #speedPanel {
      position: absolute;
      top: 18px;
      right: 20px;
      text-align: right;
    }

    #speed {
      font-size: 42px;
      font-weight: 900;
      line-height: 1;
    }

    #kmh {
      font-size: 11px;
      letter-spacing: 3px;
      opacity: 0.65;
    }

    #gear {
      margin-top: 4px;
      font-size: 13px;
      opacity: 0.8;
    }

    #mission {
      position: absolute;
      left: 20px;
      bottom: 20px;
      background: rgba(5, 5, 12, 0.72);
      border: 1px solid rgba(0, 234, 255, 0.4);
      border-radius: 10px;
      padding: 12px 15px;
      backdrop-filter: blur(8px);
    }

    #missionTitle {
      color: #00eaff;
      font-size: 10px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    #missionText {
      font-size: 13px;
    }

    #status {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 14px;
      letter-spacing: 3px;
      opacity: 0;
      transition: opacity 0.3s;
      text-align: center;
      pointer-events: none;
    }

    #status.show {
      opacity: 1;
    }

    /* MOBILE CONTROLS */

    #mobileControls {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .control {
      position: absolute;
      pointer-events: auto;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(10,10,18,0.55);
      color: white;
      font-size: 25px;
      backdrop-filter: blur(5px);
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .control:active {
      background: rgba(0,234,255,0.3);
      border-color: #00eaff;
    }

    #left {
      bottom: 28px;
      left: 25px;
    }

    #right {
      bottom: 28px;
      left: 105px;
    }

    #brake {
      bottom: 28px;
      right: 105px;
      font-size: 17px;
    }

    #gas {
      bottom: 28px;
      right: 25px;
      background: rgba(0,180,255,0.2);
      font-size: 18px;
    }

    #camera {
      top: 90px;
      right: 20px;
      width: 52px;
      height: 52px;
      font-size: 18px;
    }

    @media (min-width: 800px) {
      #mobileControls {
        display: none;
      }
    }
  </style>
</head>

<body>

<div id="game">

  <div id="hud">

    <div id="logo">
      NEON DISTRICT
      <div id="version">V0.1 — NIGHT RUN</div>
    </div>

    <div id="speedPanel">
      <div id="speed">0</div>
      <div id="kmh">KM/H</div>
      <div id="gear">N</div>
    </div>

    <div id="mission">
      <div id="missionTitle">PRIMER OBJETIVO</div>
      <div id="missionText">
        Explora Night City
      </div>
    </div>

    <div id="status">
      NEON DISTRICT
    </div>

  </div>

  <div id="mobileControls">

    <button class="control" id="left">◀</button>
    <button class="control" id="right">▶</button>

    <button class="control" id="brake">
      BRAKE
    </button>

    <button class="control" id="gas">
      GAS
    </button>

    <button class="control" id="camera">
      CAM
    </button>

  </div>

</div>


<script type="module">

/*
=========================================================
NEON DISTRICT
V0.1 — NIGHT RUN
=========================================================

Tecnología:
Three.js

Controles PC:
W / ↑       Acelerar
S / ↓       Frenar / marcha atrás
A / ←       Girar izquierda
D / →       Girar derecha
C           Cambiar cámara
R           Reiniciar posición

Móvil:
Botones táctiles

=========================================================
*/


import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const CONFIG = {

  maxSpeed: 0.85,

  reverseSpeed: 0.35,

  acceleration: 0.018,

  braking: 0.045,

  friction: 0.012,

  steering: 0.035,

  worldSize: 600

};


/* =====================================================
   ESCENA
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x050509);

scene.fog = new THREE.FogExp2(
  0x070912,
  0.0022
);


/* =====================================================
   CÁMARA
===================================================== */

const camera = new THREE.PerspectiveCamera(
  65,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(
  0,
  5,
  9
);


/* =====================================================
   RENDERER
===================================================== */

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document
  .getElementById("game")
  .appendChild(renderer.domElement);


/* =====================================================
   ILUMINACIÓN
===================================================== */

const ambientLight =
  new THREE.HemisphereLight(
    0x667799,
    0x080808,
    1.4
  );

scene.add(ambientLight);


const moon =
  new THREE.DirectionalLight(
    0x7da5ff,
    2
  );

moon.position.set(
  50,
  100,
  30
);

moon.castShadow = true;

scene.add(moon);


/* =====================================================
   SUELO
===================================================== */

const groundGeometry =
  new THREE.PlaneGeometry(
    CONFIG.worldSize,
    CONFIG.worldSize
  );

const groundMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x11151b,
    roughness: 0.85
  });

const ground =
  new THREE.Mesh(
    groundGeometry,
    groundMaterial
  );

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   CARRETERAS
===================================================== */

function createRoad(
  x,
  z,
  width,
  length,
  rotation = 0
) {

  const geometry =
    new THREE.PlaneGeometry(
      width,
      length
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0x090a0d,
      roughness: 0.8
    });

  const road =
    new THREE.Mesh(
      geometry,
      material
    );

  road.rotation.x =
    -Math.PI / 2;

  road.rotation.z =
    rotation;

  road.position.set(
    x,
    0.012,
    z
  );

  scene.add(road);


  /* Líneas */

  const lineMaterial =
    new THREE.MeshBasicMaterial({
      color: 0xcccccc
    });

  for (
    let i = -length / 2;
    i < length / 2;
    i += 8
  ) {

    const line =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          0.18,
          4
        ),
        lineMaterial
      );

    line.rotation.x =
      -Math.PI / 2;

    if (rotation === 0) {

      line.position.set(
        x,
        0.025,
        z + i
      );

    } else {

      line.position.set(
        x + i,
        0.025,
        z
      );

      line.rotation.z =
        Math.PI / 2;
    }

    scene.add(line);
  }
}


/* Carretera principal */

createRoad(
  0,
  0,
  18,
  600,
  0
);

createRoad(
  0,
  0,
  18,
  600,
  Math.PI / 2
);


/* =====================================================
   EDIFICIOS
===================================================== */

function createBuilding(
  x,
  z,
  w,
  h,
  d
) {

  const geometry =
    new THREE.BoxGeometry(
      w,
      h,
      d
    );

  const material =
    new THREE.MeshStandardMaterial({
      color:
        new THREE.Color(
          0.025 +
          Math.random() * 0.04,
          0.025 +
          Math.random() * 0.04,
          0.06 +
          Math.random() * 0.08
        )
    });

  const building =
    new THREE.Mesh(
      geometry,
      material
    );

  building.position.set(
    x,
    h / 2,
    z
  );

  building.castShadow = true;

  building.receiveShadow = true;

  scene.add(building);


  /* Luces de ventanas */

  const windowMaterial =
    new THREE.MeshBasicMaterial({
      color:
        Math.random() > 0.5
          ? 0x00d9ff
          : 0xff2b9d
    });


  const windows =
    Math.floor(h / 3);


  for (
    let i = 0;
    i < windows;
    i++
  ) {

    const window =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          0.7,
          1.1
        ),
        windowMaterial
      );

    window.position.set(
      x +
      (Math.random() - 0.5) *
      (w * 0.7),

      2 +
      i * 3,

      z -
      d / 2 -
      0.02
    );

    scene.add(window);
  }

}


/* Generar ciudad */

for (
  let x = -90;
  x <= 90;
  x += 25
) {

  for (
    let z = -90;
    z <= 90;
    z += 25
  ) {

    if (
      Math.abs(x) < 13 ||
      Math.abs(z) < 13
    ) {

      continue;
    }

    createBuilding(
      x,
      z,
      15 + Math.random() * 7,
      10 + Math.random() * 35,
      15 + Math.random() * 7
    );
  }
}


/* =====================================================
   NEONES
===================================================== */

function createNeon(
  x,
  z,
  color
) {

  const geometry =
    new THREE.BoxGeometry(
      0.15,
      0.15,
      8
    );

  const material =
    new THREE.MeshBasicMaterial({
      color
    });

  const neon =
    new THREE.Mesh(
      geometry,
      material
    );

  neon.position.set(
    x,
    0.12,
    z
  );

  scene.add(neon);

}


for (
  let i = -250;
  i < 250;
  i += 12
) {

  createNeon(
    8.8,
    i,
    0x00eaff
  );

  createNeon(
    -8.8,
    i,
    0xff168d
  );

}


/* =====================================================
   COCHE
===================================================== */

const car =
  new THREE.Group();

scene.add(car);


/* Carrocería */

const bodyGeometry =
  new THREE.BoxGeometry(
    2.2,
    0.55,
    4.3
  );

const bodyMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x15151b,
    metalness: 0.75,
    roughness: 0.25
  });

const body =
  new THREE.Mesh(
    bodyGeometry,
    bodyMaterial
  );

body.position.y =
  0.85;

body.castShadow = true;

car.add(body);


/* Cabina */

const cabinGeometry =
  new THREE.BoxGeometry(
    1.65,
    0.55,
    2
  );

const cabinMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x070a12,
    metalness: 0.4,
    roughness: 0.15
  });

const cabin =
  new THREE.Mesh(
    cabinGeometry,
    cabinMaterial
  );

cabin.position.set(
  0,
  1.3,
  -0.15
);

cabin.castShadow = true;

car.add(cabin);


/* Ruedas */

const wheelGeometry =
  new THREE.CylinderGeometry(
    0.42,
    0.42,
    0.3,
    24
  );

const wheelMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x080808,
    roughness: 0.7
  });


const wheels = [];


function createWheel(
  x,
  z
) {

  const wheel =
    new THREE.Mesh(
      wheelGeometry,
      wheelMaterial
    );

  wheel.rotation.z =
    Math.PI / 2;

  wheel.position.set(
    x,
    0.5,
    z
  );

  wheel.castShadow = true;

  car.add(wheel);

  wheels.push(wheel);
}


createWheel(
  -1.15,
  -1.35
);

createWheel(
  1.15,
  -1.35
);

createWheel(
  -1.15,
  1.35
);

createWheel(
  1.15,
  1.35
);


/* =====================================================
   NEÓN DEL COCHE
===================================================== */

const neonLight =
  new THREE.PointLight(
    0x00eaff,
    4,
    8
  );

neonLight.position.set(
  0,
  0.25,
  0
);

car.add(neonLight);


/* =====================================================
   POSICIÓN INICIAL
===================================================== */

car.position.set(
  0,
  0,
  35
);


/* =====================================================
   CONTROLES
===================================================== */

const keys = {};

window.addEventListener(
  "keydown",
  event => {

    keys[event.key.toLowerCase()] =
      true;

    if (
      event.key.toLowerCase() === "c"
    ) {

      changeCamera();
    }

    if (
      event.key.toLowerCase() === "r"
    ) {

      resetCar();
    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    keys[event.key.toLowerCase()] =
      false;

  }
);


/* =====================================================
   CONTROLES TÁCTILES
===================================================== */

function bindButton(
  id,
  key
) {

  const button =
    document.getElementById(id);

  button.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      keys[key] = true;

    }
  );

  button.addEventListener(
    "pointerup",
    () => {

      keys[key] = false;

    }
  );

  button.addEventListener(
    "pointercancel",
    () => {

      keys[key] = false;

    }
  );

  button.addEventListener(
    "pointerleave",
    () => {

      keys[key] = false;

    }
  );

}


bindButton(
  "gas",
  "w"
);

bindButton(
  "brake",
  "s"
);

bindButton(
  "left",
  "a"
);

bindButton(
  "right",
  "d"
);


document
  .getElementById("camera")
  .addEventListener(
    "click",
    changeCamera
  );


/* =====================================================
   FÍSICAS
===================================================== */

let speed = 0;

let cameraMode = 0;


function updateCar() {

  const accelerating =
    keys["w"] ||
    keys["arrowup"];

  const braking =
    keys["s"] ||
    keys["arrowdown"];

  const left =
    keys["a"] ||
    keys["arrowleft"];

  const right =
    keys["d"] ||
    keys["arrowright"];


  /* Aceleración */

  if (accelerating) {

    speed +=
      CONFIG.acceleration;

  }


  /* Frenado */

  if (braking) {

    if (speed > 0) {

      speed -=
        CONFIG.braking;

    } else {

      speed -=
        CONFIG.acceleration * 0.6;

    }

  }


  /* Fricción */

  if (
    !accelerating &&
    !braking
  ) {

    if (speed > 0) {

      speed -=
        CONFIG.friction;

    }

    if (speed < 0) {

      speed +=
        CONFIG.friction;

    }

  }


  /* Límites */

  speed =
    THREE.MathUtils.clamp(
      speed,
      -CONFIG.reverseSpeed,
      CONFIG.maxSpeed
    );


  /* Dirección */

  if (
    Math.abs(speed) > 0.01
  ) {

    const steering =
      CONFIG.steering *
      (speed / CONFIG.maxSpeed);


    if (left) {

      car.rotation.y +=
        steering;

    }


    if (right) {

      car.rotation.y -=
        steering;

    }

  }


  /* Movimiento */

  car.translateZ(
    -speed
  );


  /* Mantener dentro del mundo */

  car.position.x =
    THREE.MathUtils.clamp(
      car.position.x,
      -270,
      270
    );

  car.position.z =
    THREE.MathUtils.clamp(
      car.position.z,
      -270,
      270
    );


  /* Rotación ruedas */

  wheels.forEach(
    wheel => {

      wheel.rotation.x +=
        speed * 4;

    }
  );


  /* HUD */

  const kmh =
    Math.round(
      Math.abs(speed) *
      220
    );

  document
    .getElementById("speed")
    .textContent =
    kmh;


  let gear =
    "N";


  if (speed > 0.05) {

    gear =
      Math.min(
        6,
        Math.floor(
          kmh / 35
        ) + 1
      );

  }


  if (speed < -0.05) {

    gear =
      "R";

  }


  document
    .getElementById("gear")
    .textContent =
    "GEAR " + gear;

}


/* =====================================================
   CÁMARA
===================================================== */

function updateCamera() {

  let desired;

  if (
    cameraMode === 0
  ) {

    desired =
      new THREE.Vector3(
        0,
        4.8,
        9
      );

  } else {

    desired =
      new THREE.Vector3(
        0,
        2.2,
        5
      );

  }


  desired.applyQuaternion(
    car.quaternion
  );

  desired.add(
    car.position
  );


  camera.position.lerp(
    desired,
    0.08
  );


  const target =
    car.position.clone();


  target.y += 1;


  camera.lookAt(
    target
  );

}


function changeCamera() {

  cameraMode =
    cameraMode === 0
      ? 1
      : 0;

}


/* =====================================================
   REINICIO
===================================================== */

function resetCar() {

  car.position.set(
    0,
    0,
    35
  );

  car.rotation.y = 0;

  speed = 0;

  showStatus(
    "POSICIÓN REINICIADA"
  );

}


/* =====================================================
   MENSAJES
===================================================== */

let statusTimer;


function showStatus(
  text
) {

  const element =
    document.getElementById(
      "status"
    );

  element.textContent =
    text;

  element.classList.add(
    "show"
  );


  clearTimeout(
    statusTimer
  );


  statusTimer =
    setTimeout(
      () => {

        element.classList.remove(
          "show"
        );

      },
      1800
    );

}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

  }
);


/* =====================================================
   LOOP PRINCIPAL
===================================================== */

const clock =
  new THREE.Clock();


function animate() {

  requestAnimationFrame(
    animate
  );


  updateCar();

  updateCamera();


  renderer.render(
    scene,
    camera
  );

}


animate();


/* =====================================================
   MENSAJE INICIAL
===================================================== */

setTimeout(
  () => {

    showStatus(
      "BIENVENIDO A NIGHT CITY"
    );

  },
  500
);

</script>

</body>
  </html>
